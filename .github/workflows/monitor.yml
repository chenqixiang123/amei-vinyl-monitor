name: 偷故事的人 黑胶补货监控

# 唯一触发源：腾讯云函数每分钟调一次 workflow_dispatch（见 云函数定时触发.md）
# 2026-11-23 已移除 GitHub 原生 on.schedule —— 实测会延迟数小时，是不可控的随机触发源
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只看结果，不发邮件、不写状态"
        type: boolean
        default: false
      test_email:
        description: "发一封测试邮件（不写状态）"
        type: boolean
        default: false
      force_write:
        description: "强制写日志并提交（忽略『今天已经写过』）"
        type: boolean
        default: false

# 需要写权限，才能把 state.json 和 monitor_log.md 提交回仓库
permissions:
  contents: write

# 每分钟一次：保证同一时间只有一个 run 在干活
# 排队中的旧 run 会被后到的顶掉，不会堆成一长串
concurrency:
  group: vinyl-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 定位项目目录
        id: locate
        run: |
          if [ -f monitor.py ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f cloud-monitor/monitor.py ]; then
            echo "dir=cloud-monitor" >> "$GITHUB_OUTPUT"
          else
            echo "::error::仓库里找不到 monitor.py，请确认文件已上传"
            exit 1
          fi

      # ubuntu-latest 自带 python3，不再装 setup-python，省 10~15 秒，
      # 免得每分钟一次的 run 互相排队
      - name: 运行监控
        id: monitor
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 -V
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test_email }}" = "true" ]; then ARGS="$ARGS --test-email"; fi
          if [ "${{ inputs.force_write }}" = "true" ]; then ARGS="$ARGS --force-write"; fi
          python3 monitor.py $ARGS

      - name: 小结
        if: always()
        run: |
          echo "本次结果：五大=${{ steps.monitor.outputs.five }} / 佳佳=${{ steps.monitor.outputs.ccr }} / 滾石=${{ steps.monitor.outputs.rock }} / 有变化=${{ steps.monitor.outputs.changed }} / 提交=${{ steps.monitor.outputs.commit }} / 原因=${{ steps.monitor.outputs.reason }}"

      # 只有「状态变化」或「今天第一次运行（每日快照）」才提交，
      # 每分钟的其余 1400 多次运行完全不产生 commit
      - name: 提交状态文件
        if: ${{ inputs.dry_run != true && inputs.test_email != true && steps.monitor.outputs.commit == 'true' }}
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          git config user.name "vinyl-monitor-bot"
          git config user.email "vinyl-monitor-bot@users.noreply.github.com"
          git add state.json monitor_log.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "内容其实没变，跳过提交"
            exit 0
          fi
          git commit -m "chore: 监控 ${{ steps.monitor.outputs.reason }} $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push || (git pull --rebase --autostash && git push)
